<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="shortcut icon" href="assets/img/Logo-.png" type="image/x-icon">
    <title>Poster Tile Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --accent: #2563eb;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --border: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: var(--panel);
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.75rem;
        }

        .group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            color: var(--text-dim);
            margin-bottom: 0.375rem;
        }

        input[type="file"], input[type="number"], select {
            width: 100%;
            padding: 0.625rem;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 6px;
            box-sizing: border-box;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 1rem;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: var(--border);
            cursor: not-allowed;
        }

        #status {
            margin-top: 1rem;
            font-size: 0.875rem;
            color: var(--text-dim);
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Poster Tile PDF Generator</h1>
    
    <div class="group">
        <label>Select Design Image</label>
        <input type="file" id="imageInput" accept="image/*">
    </div>

    <div class="grid-2 group">
        <div>
            <label>Target Width (cm)</label>
            <input type="number" id="designW" value="41" step="0.1">
        </div>
        <div>
            <label>Target Height (cm)</label>
            <input type="number" id="designH" value="45" step="0.1">
        </div>
    </div>

    <div class="grid-2 group">
        <div>
            <label>Paper Size</label>
            <select id="pageSize">
                <option value="a3">A3 (29.7 x 42.0 cm)</option>
                <option value="a4">A4 (21.0 x 29.7 cm)</option>
            </select>
        </div>
        <div>
            <label>Print Margin (cm)</label>
            <input type="number" id="margin" value="1.0" step="0.1">
        </div>
    </div>

    <div class="group">
        <label>Overlap Seam (cm)</label>
        <input type="number" id="overlap" value="1.0" step="0.1">
    </div>

    <button id="generateBtn">Generate PDF Tiles</button>
    <div id="status">Upload an image to start.</div>
</div>

<script>
    const { jsPDF } = window.jspdf;

    const paperSizes = {
        a3: { w: 29.7, h: 42.0 },
        a4: { w: 21.0, h: 29.7 }
    };

    document.getElementById('generateBtn').addEventListener('click', async () => {
        const fileInput = document.getElementById('imageInput');
        const status = document.getElementById('status');

        if (!fileInput.files.length) {
            status.textContent = "Error: Select an image file first.";
            return;
        }

        status.textContent = "Processing image...";

        const file = fileInput.files[0];
        const img = new Image();
        img.src = URL.createObjectURL(file);

        await new Promise((resolve) => { img.onload = resolve; });

        // Configuration values
        const designW = parseFloat(document.getElementById('designW').value);
        const designH = parseFloat(document.getElementById('designH').value);
        const paper = paperSizes[document.getElementById('pageSize').value];
        const margin = parseFloat(document.getElementById('margin').value);
        const overlap = parseFloat(document.getElementById('overlap').value);

        // Printable limits
        const usableW = paper.w - (2 * margin);
        const usableH = paper.h - (2 * margin);

        const stepX = usableW - overlap;
        const stepY = usableH - overlap;

        const cols = Math.ceil((designW - overlap) / stepX);
        const rows = Math.ceil((designH - overlap) / stepY);

        const pxPerCmX = img.width / designW;
        const pxPerCmY = img.height / designH;

        // Create jsPDF instance (mm units)
        const pdf = new jsPDF({
            orientation: 'p',
            unit: 'mm',
            format: [paper.w * 10, paper.h * 10]
        });

        let pageCount = 0;

        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                const x0 = c * stepX;
                const y0 = r * stepY;
                const x1 = Math.min(x0 + usableW, designW);
                const y1 = Math.min(y0 + usableH, designH);

                const tileW_cm = x1 - x0;
                const tileH_cm = y1 - y0;

                if (tileW_cm <= 0 || tileH_cm <= 0) continue;

                // Crop pixels on offscreen canvas
                const cropX = Math.round(x0 * pxPerCmX);
                const cropY = Math.round(y0 * pxPerCmY);
                const cropW = Math.round(tileW_cm * pxPerCmX);
                const cropH = Math.round(tileH_cm * pxPerCmY);

                const canvas = document.createElement('canvas');
                canvas.width = cropW;
                canvas.height = cropH;
                const ctx = canvas.getContext('2d');

                ctx.drawImage(img, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

                const imgData = canvas.toDataURL('image/png');

                if (pageCount > 0) pdf.addPage();

                // Draw image on PDF (converting cm to mm)
                const drawX_mm = margin * 10;
                const drawY_mm = margin * 10;
                const drawW_mm = tileW_cm * 10;
                const drawH_mm = tileH_cm * 10;

                pdf.addImage(imgData, 'PNG', drawX_mm, drawY_mm, drawW_mm, drawH_mm);

                // Draw bounding cut lines
                pdf.setLineWidth(0.2);
                pdf.setDrawColor(180, 180, 180);
                pdf.rect(drawX_mm, drawY_mm, drawW_mm, drawH_mm);

                pageCount++;
            }
        }

        pdf.save(`poster_tiles_${designW}x${designH}cm.pdf`);
        status.textContent = `Done! Generated ${pageCount} pages (${cols}x${rows} grid).`;
    });
</script>
</body>
</html>
